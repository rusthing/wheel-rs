[package]
name = "wheel-rs"
version = "1.11.0"
edition = "2024"
authors = ["zbz"]
keywords = ["tools", "utils"]
description = "A Rust utility library providing file operations, time utilities and Duration serialization support."
categories = ["development-tools"]
license = "MIT"
homepage = "https://github.com/rusthing/wheel-rs"
repository = "https://github.com/rusthing/wheel-rs"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
log = "0.4.34"
tracing = "0.1.44"
tracing-appender = "0.2.5"
thiserror = "2.0.20"
config = "0.15.25"
serde = "1.0.229"
notify = "8.2.0"
humantime = "2.4.0"
sha2 = "0.11.0"
hex = "0.4.3"
dns-lookup = "3.0.1"
tokio = { version = "1.53.1", features = ["macros", "signal", "process", "io-util", "sync", "rt", "time"] }
bytes = "1.12.1"
nix = { version = "0.31.3", features = ["signal", "net"] }
libc = "1.0.0-alpha.4"
ipnet = "2.12.1"
regex = "1.13.1"
hickory-resolver = "0.26.1"